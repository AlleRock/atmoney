<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AleTaMoney</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/AlleRock/atmoney/main/icona.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .ios-blur { backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .hidden { display: none; }
        .tab-active { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-28">

    <header class="sticky top-0 z-30 bg-white/80 ios-blur border-b border-slate-100 px-6 pt-14 pb-5 flex justify-between items-center">
        <h1 class="text-2xl font-black text-slate-800 tracking-tighter italic">AleTaMoney</h1>
        <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest italic">v8.2 Pro</span>
            <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></div>
        </div>
    </header>
    <div id="sync-status" role="status" class="hidden mx-6 mt-3 text-xs text-rose-600" aria-live="polite"></div>

    <main id="page-home" class="p-6 space-y-6 max-w-md mx-auto">
        <div class="grid grid-cols-2 gap-4">
            <section class="bg-white rounded-[2rem] p-5 card-shadow border border-slate-50 text-center">
                <h2 class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1 italic">👛 Spese varie</h2>
                <div id="balance-vari" class="text-xl font-black transition-colors duration-500">€ 0.00</div>
            </section>
            <section class="bg-white rounded-[2rem] p-5 card-shadow border border-slate-50 text-center">
                <h2 class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1 italic">✈️ Viaggi</h2>
                <div id="balance-viaggi" class="text-xl font-black transition-colors duration-500">€ 0.00</div>
            </section>
        </div>

        <section class="bg-white rounded-3xl p-6 card-shadow border border-slate-50 space-y-4">
            <input id="edit-id" type="hidden">
            <input id="desc" type="text" placeholder="Chi o per cosa?" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-100 text-lg font-medium">
            <div class="flex gap-3">
                <input id="amount" type="number" step="0.01" placeholder="Importo €" class="w-2/3 p-4 bg-slate-50 rounded-2xl outline-none font-bold text-lg">
                <input id="date" type="date" class="w-1/3 p-4 bg-slate-50 rounded-2xl outline-none text-[10px] font-bold text-slate-500">
            </div>

            <div class="bg-slate-100 p-1 rounded-2xl flex">
                <button onclick="setCat('vari')" id="cat-vari" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all tab-active">👛 Spese varie</button>
                <button onclick="setCat('viaggi')" id="cat-viaggi" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 transition-all">✈️ Viaggi</button>
            </div>
            <input type="hidden" id="category" value="vari">

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button id="btn-out" onclick="addEntry('out')" class="bg-blue-600 text-white font-extrabold py-5 rounded-2xl active:scale-95 shadow-xl shadow-blue-100">HO DATO</button>
                <button id="btn-in" onclick="addEntry('in')" class="bg-orange-500 text-white font-extrabold py-5 rounded-2xl active:scale-95 shadow-xl shadow-orange-100">TORNATI</button>
            </div>
            <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden w-full text-slate-400 text-xs font-bold py-2 uppercase text-center italic">Annulla Modifica</button>
        </section>
    </main>

    <main id="page-history" class="hidden p-6 max-w-md mx-auto">
        <h2 class="text-3xl font-black text-slate-800 italic mb-6">Lista</h2>
        <div id="history-list" class="space-y-4"></div>
    </main>

    <main id="page-settings" class="hidden p-6 max-w-md mx-auto space-y-6">
        <h2 class="text-3xl font-black text-slate-800 italic">Dati & Backup</h2>
        <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-50 space-y-6 text-center">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportToJSON()" class="bg-slate-800 text-white text-[10px] font-bold py-4 rounded-xl uppercase tracking-widest active:scale-95">Salva JSON</button>
                <label class="bg-blue-600 text-white text-[10px] font-bold py-4 rounded-xl uppercase tracking-widest text-center cursor-pointer active:scale-95">
                    Carica JSON
                    <input type="file" id="json-file" accept=".json" class="hidden" onchange="importFromJSON(event)">
                </label>
            </div>
            <button onclick="exportToCSV()" class="w-full bg-slate-100 text-slate-600 text-[10px] font-bold py-3 rounded-xl uppercase tracking-widest">Esporta per Excel</button>
            <div class="pt-4 border-t border-slate-100">
                <button onclick="clearAllData()" class="w-full bg-rose-50 text-rose-600 text-[10px] font-bold py-4 rounded-xl uppercase border border-rose-100 active:bg-rose-600 active:text-white transition-all">Cancella Tutto</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-white/90 ios-blur rounded-[2rem] card-shadow border border-white flex justify-around items-center px-4 z-40">
        <button onclick="showPage('home')" id="nav-home" class="flex flex-col items-center">
            <svg class="w-6 h-6 mb-1 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            <span class="text-[10px] font-black uppercase italic">Nuovo</span>
        </button>
        <button onclick="showPage('history')" id="nav-history" class="flex flex-col items-center opacity-30">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
            <span class="text-[10px] font-black uppercase italic">Lista</span>
        </button>
        <button onclick="showPage('settings')" id="nav-settings" class="flex flex-col items-center opacity-30">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"></path></svg>
            <span class="text-[10px] font-black uppercase italic text-center">Dati</span>
        </button>
    </nav>

    <script>
        const API = 'https://atmoney-api.m8online.workers.dev';
        const DB_KEY = 'aleta_v8_db', SYNC_KEY = 'aleta_v8_sync';
        let entries = [];
        let storedRaw = null, storedSync = null, pending = false, blocked = false, busy = false;
        const LOCAL_ONLY = 'Movimenti salvati solo su questo dispositivo. Sincronizzazione non riuscita o non confermata: nessun reinvio automatico. Conserva un backup JSON prima di usare altri dispositivi.';

        function syncStatus(message) {
            const el = document.getElementById('sync-status');
            el.textContent = message;
            el.classList.toggle('hidden', !message);
        }

        function validateEntries(value) {
            if (!Array.isArray(value)) throw new Error('Il backup deve contenere un elenco di movimenti.');
            const ids = new Set();
            for (const e of value) {
                if (!e || typeof e !== 'object' || Array.isArray(e)) throw new Error('Movimento non valido.');
                const id = typeof e.id === 'number' ? e.id : typeof e.id === 'string' && /^\d+$/.test(e.id) ? Number(e.id) : NaN;
                const date = typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? new Date(e.date + 'T00:00:00Z') : new Date(NaN);
                if (!Number.isSafeInteger(id) || id < 0 || ids.has(id) ||
                    typeof e.desc !== 'string' || typeof e.amount !== 'number' || !Number.isFinite(e.amount) ||
                    !['out', 'in'].includes(e.type) || (e.type === 'out' ? e.amount < 0 : e.amount > 0) ||
                    (e.cat !== undefined && !['vari', 'viaggi'].includes(e.cat)) ||
                    !Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== e.date) {
                    throw new Error('Movimento con identificativo, importo, data, tipo o categoria non validi.');
                }
                ids.add(id);
            }
            return value; // Nessuna conversione o rimozione di campi dei backup esistenti.
        }

        function sameEntries(a, b) {
            const canonical = value => JSON.stringify(value, (key, item) => item && typeof item === 'object' && !Array.isArray(item)
                ? Object.keys(item).sort().reduce((obj, name) => { obj[name] = item[name]; return obj; }, Object.create(null)) : item);
            return canonical(a) === canonical(b);
        }

        function storageUnchanged() {
            if (blocked) return false;
            try {
                if (localStorage.getItem(DB_KEY) === storedRaw && localStorage.getItem(SYNC_KEY) === storedSync) return true;
            } catch(e) {}
            blocked = true;
            syncStatus('Archivio locale non accessibile o cambiato in un’altra finestra. Nessun dato sovrascritto: ricarica prima di modificare.');
            return false;
        }

        async function requestData(method = 'GET', data) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            try {
                const res = await fetch(`${API}/data`, {
                    method, cache: 'no-store', signal: controller.signal,
                    ...(method === 'POST' ? {headers: {'Content-Type': 'application/json'}, body: JSON.stringify({entries: data})} : {})
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                if (method === 'POST') { await res.text(); return; }
                const json = await res.json();
                return validateEntries(json.entries);
            } finally { clearTimeout(timeout); }
        }

        function markPending() {
            const meta = JSON.stringify({pending: true});
            localStorage.setItem(SYNC_KEY, meta);
            storedSync = meta;
            pending = true;
        }

        function markConfirmed() {
            const meta = JSON.stringify({pending: false, snapshot: storedRaw});
            localStorage.setItem(SYNC_KEY, meta);
            storedSync = meta;
            pending = false;
            syncStatus('');
        }

        async function save(nextEntries = entries, canSync = false) {
            if (!storageUnchanged()) return false;
            try {
                const raw = JSON.stringify(validateEntries(nextEntries));
                markPending(); // Prima del dato: anche un'interruzione lascia la copia locale protetta.
                localStorage.setItem(DB_KEY, raw);
                storedRaw = raw;
                entries = nextEntries;
            } catch(e) {
                syncStatus('Salvataggio locale non riuscito. I movimenti precedenti sono conservati; la modifica non è stata inviata.');
                alert('Salvataggio locale non riuscito. Controlla lo spazio disponibile e conserva un backup JSON.');
                return false;
            }
            if (canSync) {
                try {
                    await requestData('POST', nextEntries);
                    const confirmed = await requestData();
                    if (!sameEntries(confirmed, nextEntries) || !storageUnchanged()) throw new Error('Conferma remota mancante');
                    markConfirmed();
                } catch(e) { if (!blocked) syncStatus(LOCAL_ONLY); }
            } else { syncStatus(LOCAL_ONLY); }
            return true;
        }

        async function refreshForChange() {
            if (pending) return {data: entries, canSync: false};
            try {
                const remote = await requestData();
                if (!storageUnchanged()) return null;
                // Una vecchia cache senza conferma potrebbe contenere modifiche offline.
                if (storedRaw !== null && !storedSync && !sameEntries(remote, entries)) {
                    markPending();
                    syncStatus(LOCAL_ONLY);
                    return {data: entries, canSync: false};
                }
                return {data: remote, canSync: true};
            } catch(e) { return {data: entries, canSync: false}; }
        }

        async function changeEntries(makeNext) {
            if (busy) { syncStatus('Operazione in corso. Attendi il completamento e riprova.'); return false; }
            if (!storageUnchanged()) return false;
            busy = true;
            try {
                const base = await refreshForChange();
                return base ? await save(makeNext(base.data), base.canSync) : false;
            } finally { busy = false; updateUI(); }
        }

        async function loadData() {
            if (busy) return;
            busy = true;
            try {
                storedRaw = localStorage.getItem(DB_KEY);
                storedSync = localStorage.getItem(SYNC_KEY);
                entries = storedRaw === null ? [] : validateEntries(JSON.parse(storedRaw));
                const meta = storedSync === null ? null : JSON.parse(storedSync);
                if (storedSync !== null && (!meta || typeof meta.pending !== 'boolean' || (meta.pending === false && typeof meta.snapshot !== 'string'))) throw new Error('Stato locale non valido');
                pending = meta !== null && (meta.pending !== false || meta.snapshot !== storedRaw);
            } catch(e) {
                blocked = true;
                syncStatus('Archivio locale non leggibile: originale conservato. Nessun caricamento o salvataggio remoto eseguito. Usa Salva JSON per conservarne una copia.');
            }
            updateUI();
            try {
                if (blocked) return;
                if (pending) { syncStatus(LOCAL_ONLY); return; }
                const base = await refreshForChange();
                if (!base || !storageUnchanged()) return;
                if (!base.canSync) { syncStatus(pending ? LOCAL_ONLY : 'Caricamento remoto non riuscito. La copia locale è conservata.'); return; }
                const raw = JSON.stringify(base.data);
                if (storedRaw === null || !sameEntries(entries, base.data)) {
                    localStorage.setItem(DB_KEY, raw);
                    storedRaw = raw;
                    entries = base.data;
                }
                markConfirmed();
            } catch(e) {
                syncStatus('Impossibile aggiornare la copia locale. Conserva un backup JSON prima di modificare i dati.');
            } finally { busy = false; updateUI(); }
        }

        function setToday() {
            const today = new Date();
            document.getElementById('date').value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        }

        function setCat(cat) {
            document.getElementById('category').value = cat;
            document.getElementById('cat-vari').className = `flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${cat === 'vari' ? 'tab-active' : 'text-slate-400'}`;
            document.getElementById('cat-viaggi').className = `flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${cat === 'viaggi' ? 'tab-active' : 'text-slate-400'}`;
        }

        async function addEntry(type) {
            let desc = document.getElementById('desc').value;
            const amountVal = document.getElementById('amount').value;
            const date = document.getElementById('date').value;
            const editId = document.getElementById('edit-id').value;
            const cat = document.getElementById('category').value;

            if (!amountVal || !date || !Number.isFinite(Number(amountVal))) return alert("Mancano dati!");
            const amount = Math.abs(parseFloat(amountVal));
            const saved = await changeEntries(base => {
                const next = base.slice();
                const data = { id: editId || Date.now(), desc: desc || "Movimento", amount: type === 'out' ? amount : -amount, date, type, cat };
                if (!editId) while (next.some(e => e.id == data.id)) data.id++;
                const index = editId ? next.findIndex(e => e.id == editId) : -1;
                if (index >= 0) next[index] = data; else next.unshift(data);
                return next;
            });
            if (saved) { cancelEdit(); showPage('history'); }
        }



        function updateUI() {
            const histEl = document.getElementById('history-list');
            let tVari = 0, tViaggi = 0;

            const fragment = document.createDocumentFragment();
            entries.forEach(e => {
                if (e.cat === 'viaggi') tViaggi += e.amount; else tVari += e.amount;
                const icon = e.cat === 'viaggi' ? '✈️' : '👛';
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-[2rem] flex justify-between items-center card-shadow border border-slate-50';
                // Solo struttura costante: tutti i valori dei movimenti passano da textContent.
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="font-black text-slate-800 text-lg leading-tight"></div>
                        <div class="text-[10px] font-bold text-slate-300 uppercase italic tracking-wider"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="font-black text-lg"></div>
                        <button class="p-2 text-slate-300 active:text-blue-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2.5"/></svg></button>
                        <button class="p-2 text-slate-200 active:text-rose-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2.5"/></svg></button>
                    </div>
                `;
                card.children[0].children[0].textContent = icon + ' ' + e.desc;
                card.children[0].children[1].textContent = new Date(e.date).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'});
                const amountEl = card.children[1].children[0];
                amountEl.classList.add(e.type === 'out' ? 'text-blue-500' : 'text-orange-500');
                amountEl.textContent = (e.type === 'out' ? '+' : '-') + Math.abs(e.amount).toFixed(2) + '€';
                const buttons = card.querySelectorAll('button');
                buttons[0].addEventListener('click', () => editEntry(e.id));
                buttons[1].addEventListener('click', () => deleteEntry(e.id));
                fragment.appendChild(card);
            });
            histEl.textContent = '';
            histEl.appendChild(fragment);

            const elVari = document.getElementById('balance-vari');
            const elViaggi = document.getElementById('balance-viaggi');

            elVari.innerText = `€ ${tVari.toLocaleString('it-IT', {minimumFractionDigits: 2})}`;
            elVari.className = `text-xl font-black ${tVari >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;

            elViaggi.innerText = `€ ${tViaggi.toLocaleString('it-IT', {minimumFractionDigits: 2})}`;
            elViaggi.className = `text-xl font-black ${tViaggi >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        }

        function editEntry(id) {
            const e = entries.find(x => x.id == id);
            document.getElementById('edit-id').value = e.id;
            document.getElementById('desc').value = e.desc;
            document.getElementById('amount').value = Math.abs(e.amount);
            document.getElementById('date').value = e.date;
            setCat(e.cat || 'vari');
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            showPage('home');
        }

        function cancelEdit() { resetForm(); document.getElementById('edit-id').value = ''; document.getElementById('btn-cancel-edit').classList.add('hidden'); }
        function resetForm() { document.getElementById('desc').value = ''; document.getElementById('amount').value = ''; setToday(); }
        async function deleteEntry(id) { 
            if(confirm("Eliminare?")) { 
                await changeEntries(base => base.filter(e => e.id !== id));
            } 
        }
        async function clearAllData() { 
            if(confirm("Svuotare tutto?")) { 
                await changeEntries(() => []);
            } 
        }
        function showPage(p) { ['home', 'history', 'settings'].forEach(x => { document.getElementById('page-'+x).classList.toggle('hidden', x!==p); document.getElementById('nav-'+x).style.opacity = x===p?"1":"0.3"; }); }
        
        function exportToJSON() { 
            if (blocked && storedRaw === null) return alert('Impossibile leggere l’archivio locale: nessun backup esportato.');
            const blob = new Blob([blocked && storedRaw !== null ? storedRaw : JSON.stringify(entries, null, 2)], { type: 'application/json' });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `AleTa_Backup_${new Date().toLocaleDateString('it-IT').replace(/\//g, '-')}.json`; a.click();
        }

        function importFromJSON(ev) {
            const file = ev.target.files[0];
            if (!file) return;
            const fr = new FileReader();
            fr.onload = async (e) => {
                try {
                    const imported = validateEntries(JSON.parse(e.target.result));
                    if (!confirm('Sostituire tutti i movimenti esistenti con quelli del backup?')) return;
                    if (await changeEntries(() => imported)) alert(pending ? 'Dati importati sul dispositivo. Sincronizzazione non riuscita o non confermata.' : 'Dati importati!');
                } catch(e) { alert('File non valido: ' + e.message); }
                finally { ev.target.value = ''; }
            };
            fr.onerror = () => { alert('Impossibile leggere il file. Archivio non modificato.'); ev.target.value = ''; };
            fr.readAsText(file);
        }

        function csvCell(value, text = true) {
            let cell = String(value);
            if (text && (/^[\s\u0000-\u001f]*[=+\-@＝＋－＠]/.test(cell) || /^[\t\r\n]/.test(cell))) cell = '\t' + cell;
            return '"' + cell.replace(/"/g, '""') + '"';
        }

        function exportToCSV() {
            let csv = "Data;Descrizione;Categoria;Importo\r\n";
            entries.forEach(e => csv += [csvCell(e.date), csvCell(e.desc), csvCell(e.cat === undefined ? '' : e.cat), csvCell(e.amount.toFixed(2), false)].join(';') + '\r\n');
            const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Report.csv`; a.click();
        }

        setToday();
        loadData();
    </script>
</body>
</html>
